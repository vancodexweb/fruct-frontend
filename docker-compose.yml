# Fully standalone deployment for the Fruct CRM frontend — its own Caddy,
# its own domain, no dependency on vancodexweb/fruct's compose files.
#
# The only thing this stack needs from the backend is its Docker network
# name, so this Caddy's `api` reverse proxy (see deploy/Caddyfile) can reach
# the backend's `api` container by service name. Nothing here reads or
# assumes a specific directory layout for the backend repo.
#
#   docker compose up -d --build
#
# IMPORTANT — port 80/443 conflict: this stack's `caddy` publishes 80/443,
# same as the backend's own already-running Caddy. Two containers cannot
# both bind the same host ports, so before running the command above, free
# them by stopping the backend's Caddy — this new Caddy takes over BOTH
# domains (see deploy/Caddyfile and BACKEND_DOMAIN below):
#
#   docker stop fruct-caddy-1
#
# IMPORTANT — network name: `networks.backend_net.name` below must match the
# backend's actual Docker network. Verify with `docker network ls` — Compose
# names a project's default network `<project>_default`; if the backend's
# containers are named `fruct-api-1` etc., its project is "fruct" and the
# network is (almost always) `fruct_default`. If `docker compose up` fails
# with "network ... not found", update the name below to match.
services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
      # Internal Docker network hostname of the backend's `api` service —
      # reachable because `frontend` joins the backend's own network below.
      # Never the public BACKEND_DOMAIN — this call never leaves Docker.
      API_URL: http://api:3001
    networks:
      - backend_net
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://localhost:3000/api/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    # No published ports — Caddy is the only public entry point, reaching
    # this container over the shared Docker network by its service name.

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    # On hosts using systemd-resolved, Docker can copy the host's
    # 127.0.0.53 stub resolver straight into the container's /etc/resolv.conf
    # — that address is the container's own loopback, not the host's, so
    # ACME's outbound DNS lookups fail with "connection refused" instead of
    # reaching a real resolver. Pointing this container at public resolvers
    # directly sidesteps the host's resolv.conf entirely.
    dns:
      - 1.1.1.1
      - 8.8.8.8
    env_file:
      - .env
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      frontend:
        condition: service_healthy
    networks:
      - backend_net
    # No dependency on the backend's `api` container's health — it's managed
    # by a separate, already-running Compose project this stack doesn't
    # control. Caddy simply retries with a 502 until it's reachable.

networks:
  backend_net:
    external: true
    name: fruct_default

volumes:
  caddy_data:
  caddy_config:
